<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Machine Code IDE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="button">click me</button>
<p id="output"></p>

  <script src="script.js"></script>
  <script>
    const button = document.getElementById('button');
    const output = document.getElementById('output');

    button.addEventListener('click', async () => {
      const payload = Array.from({length:16},()=>Array.from({length:4},()=>String.fromCharCode(Math.random()*256|0)).join(""))
      const response = await fetch("/code/upload", {
        method: "POST",
        headers: {"seshID": "1234567890", "Content-Type": "application/json"},
        body: JSON.stringify({ code: payload })
      })
      const data = await response.text();
      output.textContent = data;
      console.log(data);
    });
  </script>
</body>
</html>
